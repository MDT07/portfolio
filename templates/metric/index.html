<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METRIC — CRM поддержка для ведения бизнеса</title>
<meta name="description" content="METRIC — универсальная CRM-платформа: сделки, клиенты, задачи, аналитика и конструктор собственных систем.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F8FAFC; --panel:#FFFFFF; --panel-2:#F1F5F9; --panel-3:#E9EEF5;
  --border:#E2E8F0; --border-strong:#CBD5E1;
  --text:#0F172A; --text-2:#475569; --muted:#8A94A6;
  --accent:#4F46E5; --accent-hover:#4338CA; --accent-soft:#EEF2FF; --accent-soft-2:#E0E7FF; --on-accent:#FFFFFF;
  --green:#059669; --green-soft:#ECFDF5; --red:#DC2626; --red-soft:#FEF2F2;
  --amber:#D97706; --amber-soft:#FFFBEB; --blue:#2563EB; --blue-soft:#EFF6FF;
  --violet:#7C3AED; --violet-soft:#F5F3FF; --pink:#DB2777; --pink-soft:#FDF2F8;
  --teal:#0D9488; --teal-soft:#F0FDFA;
  --radius:10px; --radius-s:8px; --radius-xs:6px;
  --sidebar-w:240px; --topbar-h:56px; --row-h:36px;
  --shadow:0 1px 2px rgba(15,23,42,.05);
  --shadow-pop:0 16px 40px -12px rgba(15,23,42,.22), 0 4px 12px rgba(15,23,42,.08);
  --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
}
[data-theme="dark"]{
  --bg:#0F1115; --panel:#16181D; --panel-2:#1C1F26; --panel-3:#23262F;
  --border:#262A33; --border-strong:#363B47;
  --text:#E8EAEF; --text-2:#A6ABB8; --muted:#6E7482;
  --accent:#818CF8; --accent-hover:#A5B4FC; --accent-soft:#22243C; --accent-soft-2:#2B2E4A; --on-accent:#11131A;
  --green:#34D399; --green-soft:#0D2B22; --red:#F87171; --red-soft:#331717;
  --amber:#FBBF24; --amber-soft:#2E2410; --blue:#60A5FA; --blue-soft:#152238;
  --violet:#A78BFA; --violet-soft:#241F3D; --pink:#F472B6; --pink-soft:#331626;
  --teal:#2DD4BF; --teal-soft:#0C2A27;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-pop:0 16px 40px -12px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.4);
}
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  font-family:var(--font-ui); background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.45; height:100%; overflow:hidden;
  -webkit-font-smoothing:antialiased; transition:background .2s ease,color .2s ease;
}
::selection{background:var(--accent-soft-2);color:var(--text)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
svg{display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
/* ============ SHELL ============ */
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh}
/* ---- Sidebar ---- */
.sidebar{
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:var(--topbar-h);border-bottom:1px solid var(--border);flex:none}
.brand-mark{width:26px;height:26px;flex:none}
.brand-name{font-weight:800;font-size:15px;letter-spacing:.06em}
.brand-tag{font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:12px 10px 16px;display:flex;flex-direction:column;gap:2px}
.nav-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--radius-xs);
  color:var(--text-2);font-weight:500;font-size:13.5px;text-align:left;width:100%;
  transition:background .15s ease,color .15s ease;position:relative;
}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .n-ico{width:18px;height:18px;flex:none;color:currentColor;opacity:.85}
.nav-item .n-count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.nav-item.active .n-count{color:var(--accent)}
.sidebar-foot{flex:none;border-top:1px solid var(--border);padding:10px}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--radius-xs);width:100%;text-align:left}
.user-chip:hover{background:var(--panel-2)}
.avatar{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.u-name{font-size:13px;font-weight:600;line-height:1.2}
.u-role{font-size:11px;color:var(--muted)}
/* ---- Main ---- */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{
  height:var(--topbar-h);flex:none;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 20px;position:relative;z-index:30;
}
.burger{display:none;width:34px;height:34px;border-radius:var(--radius-xs);align-items:center;justify-content:center;color:var(--text-2)}
.burger:hover{background:var(--panel-2)}
.search-trigger{
  display:flex;align-items:center;gap:8px;flex:0 1 340px;height:34px;padding:0 10px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-s);
  color:var(--muted);font-size:13px;transition:border-color .15s ease;
}
.search-trigger:hover{border-color:var(--border-strong)}
.search-trigger kbd{margin-left:auto}
kbd{
  font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);background:var(--panel);
  border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;
}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{
  width:34px;height:34px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:background .15s ease,color .15s ease;position:relative;
}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:1.5px solid var(--panel)}
.btn{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--radius-xs);
  font-weight:600;font-size:13px;border:1px solid transparent;transition:background .15s ease,border-color .15s ease,color .15s ease;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{border-color:var(--border);color:var(--text-2);background:var(--panel)}
.btn-ghost:hover{background:var(--panel-2);color:var(--text)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px}
.view{flex:1;overflow-y:auto;padding:24px 28px 64px;scroll-behavior:smooth}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.view-title{font-size:22px;font-weight:800;letter-spacing:-.01em}
.view-sub{font-size:13px;color:var(--muted);margin-top:3px}
.view-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ============ COMPONENTS ============ */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 0}
.card-title{font-size:13.5px;font-weight:700}
.card-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.grid{display:grid;gap:16px}
.grid-kpi{grid-template-columns:repeat(4,1fr)}
.grid-2{grid-template-columns:1.7fr 1fr}
.grid-2e{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
/* KPI */
.kpi{padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.kpi-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font-family:var(--font-mono);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px}
.delta.up{color:var(--green);background:var(--green-soft)}
.delta.down{color:var(--red);background:var(--red-soft)}
.spark{position:absolute;right:12px;top:14px;opacity:.9}
/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:0 12px;height:var(--row-h);border-bottom:1px solid var(--border);
  white-space:nowrap;user-select:none;position:sticky;top:0;background:var(--panel);z-index:1;
}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--text)}
.tbl td{padding:0 12px;height:44px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
.tbl tbody tr{transition:background .12s ease;cursor:pointer}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.tbl .t-strong{font-weight:600}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge .b-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-green{color:var(--green);background:var(--green-soft)} .b-red{color:var(--red);background:var(--red-soft)}
.b-amber{color:var(--amber);background:var(--amber-soft)} .b-blue{color:var(--blue);background:var(--blue-soft)}
.b-violet{color:var(--violet);background:var(--violet-soft)} .b-pink{color:var(--pink);background:var(--pink-soft)}
.b-teal{color:var(--teal);background:var(--teal-soft)} .b-grey{color:var(--text-2);background:var(--panel-2)}
/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--text-2)}
.input,select.input,textarea.input{
  height:36px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-xs);
  background:var(--panel);outline:none;transition:border-color .15s ease,box-shadow .15s ease;width:100%;
}
textarea.input{height:auto;min-height:76px;padding:8px 10px;resize:vertical}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Segmented */
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-xs);padding:2px;gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:5px;font-size:12px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;min-height:300px}
.kb-col{flex:0 0 264px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 220px)}
.kb-head{display:flex;align-items:center;gap:8px;padding:10px 12px;flex:none}
.kb-title{font-size:12.5px;font-weight:700}
.kb-count{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.kb-sum{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-2)}
.kb-body{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;min-height:40px}
.kb-card{
  background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-xs);
  padding:10px 10px 9px;cursor:grab;box-shadow:var(--shadow);transition:box-shadow .15s ease,transform .15s ease,border-color .15s;
}
.kb-card:hover{border-color:var(--border-strong);border-left-color:var(--accent)}
.kb-card.dragging{opacity:.55;cursor:grabbing;box-shadow:var(--shadow-pop)}
.kb-card-title{font-size:13px;font-weight:600;line-height:1.3}
.kb-card-co{font-size:11.5px;color:var(--muted);margin-top:2px}
.kb-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.kb-card-val{font-family:var(--font-mono);font-size:12.5px;font-weight:700}
.kb-card-meta{display:flex;gap:6px;align-items:center}
.kb-col.drop-hint{border-color:var(--accent);background:var(--accent-soft)}
.kb-add{flex:none;margin:0 8px 8px;height:30px;border:1px dashed var(--border-strong);border-radius:var(--radius-xs);color:var(--muted);font-size:12px;font-weight:600}
.kb-add:hover{color:var(--accent);border-color:var(--accent)}
/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:80;opacity:0;transition:opacity .18s ease;backdrop-filter:blur(2px);pointer-events:none}
.overlay.open{pointer-events:auto}
[data-theme="dark"] .overlay{background:rgba(0,0,0,.55)}
.overlay.open{opacity:1}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:460px;max-width:94vw;background:var(--panel);z-index:90;
  border-left:1px solid var(--border);box-shadow:var(--shadow-pop);transform:translateX(100%);
  transition:transform .22s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--border);flex:none}
.drawer-title{font-size:16px;font-weight:800;line-height:1.25}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px 32px}
.drawer-foot{flex:none;border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end}
.x-btn{width:30px;height:30px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.x-btn:hover{background:var(--panel-2);color:var(--text)}
/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{
  width:520px;max-width:100%;max-height:88vh;background:var(--panel);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow-pop);display:flex;flex-direction:column;transform:translateY(10px) scale(.98);opacity:0;
  transition:transform .18s ease,opacity .18s ease;
}
.modal.open{transform:none;opacity:1}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;flex:none}
.modal-title{font-size:15.5px;font-weight:800}
.modal-body{overflow-y:auto;padding:4px 20px 16px}
.modal-foot{flex:none;border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end}
/* Command palette */
.palette{
  position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:620px;max-width:94vw;z-index:100;
  background:var(--panel);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow-pop);overflow:hidden;
}
.palette-input{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid var(--border)}
.palette-input input{flex:1;border:none;outline:none;background:none;font-size:15px;height:100%}
.palette-list{max-height:340px;overflow-y:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-xs);cursor:pointer;font-size:13.5px}
.pal-item .p-ico{width:16px;height:16px;color:var(--muted)}
.pal-item.sel{background:var(--accent-soft);color:var(--accent)}
.pal-item.sel .p-ico{color:var(--accent)}
.pal-item .p-hint{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.pal-group{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
/* Toasts */
.toasts{position:fixed;bottom:20px;right:20px;z-index:120;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border-strong);
  border-radius:var(--radius-s);box-shadow:var(--shadow-pop);padding:10px 14px;font-size:13px;font-weight:500;
  transform:translateY(8px);opacity:0;transition:transform .2s ease,opacity .2s ease;pointer-events:auto;max-width:360px;
}
.toast.show{transform:none;opacity:1}
.toast .t-ico{width:16px;height:16px;flex:none}
.toast.ok .t-ico{color:var(--green)} .toast.err .t-ico{color:var(--red)} .toast.info .t-ico{color:var(--accent)}
/* AI chat */
.ai-fab{
  position:fixed;right:20px;bottom:20px;z-index:70;height:40px;padding:0 16px;border-radius:20px;
  background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;
  box-shadow:var(--shadow-pop);transition:background .15s ease,transform .15s ease;
}
.ai-fab:hover{background:var(--accent-hover);transform:translateY(-1px)}
.ai-panel{
  position:fixed;right:20px;bottom:20px;z-index:110;width:400px;max-width:calc(100vw - 40px);height:560px;max-height:calc(100vh - 80px);
  background:var(--panel);border:1px solid var(--border-strong);border-radius:16px;box-shadow:var(--shadow-pop);
  display:flex;flex-direction:column;overflow:hidden;transform:translateY(12px) scale(.98);opacity:0;pointer-events:none;
  transition:transform .2s cubic-bezier(.32,.72,0,1),opacity .2s ease;
}
.ai-panel.open{transform:none;opacity:1;pointer-events:auto}
.ai-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex:none;background:var(--panel-2)}
.ai-title{font-size:13.5px;font-weight:800}
.ai-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.ai-status .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.ai-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.ai-msg.bot{background:var(--panel-2);border:1px solid var(--border);border-top-left-radius:4px;align-self:flex-start}
.ai-msg.user{background:var(--accent);color:var(--on-accent);border-top-right-radius:4px;align-self:flex-end}
.ai-msg.bot .msg-act{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.ai-suggests{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px;flex:none}
.ai-suggests button{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:14px;padding:5px 10px}
.ai-suggests button:hover{background:var(--accent-soft-2)}
.ai-input{flex:none;border-top:1px solid var(--border);display:flex;gap:8px;padding:10px 12px}
.ai-input input{flex:1;height:36px;border:1px solid var(--border);border-radius:18px;padding:0 14px;outline:none;background:var(--panel-2)}
.ai-input input:focus{border-color:var(--accent);background:var(--panel)}
.ai-send{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.ai-send:hover{background:var(--accent-hover)}

/* ---------- SVG sparkline / area chart ---------- */
function sparkSVG(values,w,h,color){
  w=w||96;h=h||28;const max=Math.max(...values),min=Math.min(...values),rg=(max-min)||1;
  const pts=values.map((v,i)=>[i/(values.length-1)*w,h-2-((v-min)/rg)*(h-4)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  return '<svg class="spark" width="'+w+'" height="'+h+'"><path d="'+d+'" fill="none" stroke="'+(color||"var(--accent)")+'" stroke-width="1.8" stroke-linecap="round"/></svg>';
}
function areaChart(container,labels,series){
  const W=container.clientWidth||720,H=240,padL=44,padR=10,padT=14,padB=24;
  const max=Math.max(...series)*1.15;
  const X=i=>padL+(W-padL-padR)*(i/(series.length-1));
  const Y=v=>padT+(H-padT-padB)*(1-v/max);
  const pts=series.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=line+"L"+X(series.length-1).toFixed(1)+","+(H-padB)+"L"+X(0).toFixed(1)+","+(H-padB)+"Z";
  let grid="";
  for(let g=0;g<=4;g++){const y=padT+(H-padT-padB)*g/4;const val=max*(1-g/4);
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>'
      +'<text x="'+(padL-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--font-mono)">'+fmtMoneyShort(val).replace(" ₽","")+"</text>"}
  let xlab="";
  labels.forEach((lb,i)=>{if(i%Math.ceil(labels.length/6)===0)xlab+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="var(--font-mono)">'+esc(lb)+"</text>"});
  container.innerHTML='<svg width="100%" height="'+H+'" viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none" style="display:block">'
    +grid
    +'<path d="'+area+'" fill="var(--accent)" opacity="0.08"/>'
    +'<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>'
    +'<line id="ch-cross" x1="0" y1="'+padT+'" x2="0" y2="'+(H-padB)+'" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>'
    +'<circle id="ch-dot" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2" opacity="0"/>'
    +xlab+"</svg>";
  const svg=container.querySelector("svg"),cross=container.querySelector("#ch-cross"),dot=container.querySelector("#ch-dot");
  try{
    const paths=svg.querySelectorAll("path");
    const linePath=paths[paths.length-1],areaPath=paths[0];
    const L=linePath.getTotalLength();
    linePath.style.strokeDasharray=L;linePath.style.strokeDashoffset=L;
    linePath.getBoundingClientRect();
    linePath.style.transition="stroke-dashoffset .9s cubic-bezier(.32,.72,0,1)";
    linePath.style.strokeDashoffset="0";
    areaPath.style.opacity="0";areaPath.style.transition="opacity .9s ease .3s";
    requestAnimationFrame(()=>{areaPath.style.opacity="0.08"});
  }catch(e){}
  svg.addEventListener("mousemove",e=>{
    const r=svg.getBoundingClientRect();
    const px=(e.clientX-r.left)*(W/r.width);
    let i=Math.round((px-padL)/(W-padL-padR)*(series.length-1));
    i=Math.max(0,Math.min(series.length-1,i));
    const cx=X(i),cy=Y(series[i]);
    cross.setAttribute("x1",cx);cross.setAttribute("x2",cx);cross.setAttribute("opacity",1);
    dot.setAttribute("cx",cx);dot.setAttribute("cy",cy);dot.setAttribute("opacity",1);
    showTip(e.clientX,e.clientY,labels[i],[[t("dash.kpi.revenue"),fmtMoney(series[i])]]);
  });
  svg.addEventListener("mouseleave",()=>{cross.setAttribute("opacity",0);dot.setAttribute("opacity",0);hideTip()});
}

function showTip(x,y,title,rows){
  if(!tipEl){tipEl=el("div","chart-tip");document.body.appendChild(tipEl)}
  tipEl.innerHTML='<div class="ct-t">'+esc(title)+"</div>"+rows.map(r=>'<div class="ct-r"><span>'+esc(r[0])+"</span><b>"+esc(r[1])+"</b></div>").join("");
  tipEl.style.opacity=1;
  const w=tipEl.offsetWidth;
  tipEl.style.left=Math.min(window.innerWidth-w-12,x+14)+"px";tipEl.style.top=(y-14)+"px";
}
function hideTip(){if(tipEl)tipEl.style.opacity=0}

function weeklyRevenue(){
  const weeks=12,res=new Array(weeks).fill(0),now=Date.now();
  const src=state.invoices.filter(i=>i.status==="paid").map(i=>({ts:new Date(i.issuedAt).getTime(),v:i.amount}))
    .concat(state.deals.filter(d=>d.stage==="won").map(d=>({ts:new Date(d.updatedAt).getTime(),v:d.value*.35})));
  src.forEach(s=>{const w=Math.floor((now-s.ts)/(7*864e5));if(w>=0&&w<weeks)res[weeks-1-w]+=s.v});
  return res.map((v,i)=>Math.round(v/1000+40+30*Math.sin(i*1.1)+(i*9)));
}

function countUpKpis(root){
  $$(".kpi-value[data-mk]",root).forEach(elm=>{
    const m=kpiMetric(elm.dataset.mk);const target=m.num||0;
    const t0=performance.now(),dur=950;
    function fr(now){const p=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-p,3);
      elm.textContent=m.fmt(target*e);
      if(p<1)requestAnimationFrame(fr)}
    requestAnimationFrame(fr);
  });
}

function kbPointerDown(e,card){
  if(e.button!==0)return;
  const startX=e.clientX,startY=e.clientY;let dragging=false,clone=null,overCol=null;
  const dealId=card.dataset.id;
  function move(ev){
    if(!dragging&&Math.hypot(ev.clientX-startX,ev.clientY-startY)>6){
      dragging=true;
      clone=card.cloneNode(true);
      clone.classList.add("dragging");
      const r=card.getBoundingClientRect();
      clone.style.cssText+=";position:fixed;left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;z-index:200;pointer-events:none;transform:rotate(2deg)";
      document.body.appendChild(clone);card.style.opacity=".35";
    }
    if(dragging&&clone){
      clone.style.left=(ev.clientX-24)+"px";clone.style.top=(ev.clientY-16)+"px";
      clone.style.display="none";
      const under=document.elementFromPoint(ev.clientX,ev.clientY);
      clone.style.display="";
      const col=under?under.closest(".kb-col"):null;
      if(overCol&&overCol!==col)overCol.classList.remove("drop-hint");
      overCol=col;if(col)col.classList.add("drop-hint");
    }
  }
  function up(ev){
    document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);
    if(clone)clone.remove();card.style.opacity="";
    if(overCol)overCol.classList.remove("drop-hint");
    if(dragging){
      if(overCol){
        const d=dealById(dealId);const ns=overCol.dataset.stage;
        if(d&&d.stage!==ns){d.stage=ns;d.prob=stageProb(ns);d.updatedAt=todayISO();lastMovedId=d.id;save();
          actLog("deal",(state.lang==="ru"?"сделка перешла на этап «"+stageLabel(ns)+"»":"deal moved to "+stageLabel(ns))+" · "+d.title);
          toast(t("t.moved")+": "+stageLabel(ns),"ok");renderView()}
      }
    }else{openDealDrawer(dealId)}
  }
  document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);
}

function pushHist(page){const h=hist[page.id]=hist[page.id]||{undo:[],redo:[]};h.undo.push(JSON.stringify(page.widgets));if(h.undo.length>60)h.undo.shift();h.redo=[]}
function canUndo(page){const h=hist[page.id];return!!(h&&h.undo.length)}

ACTIONS["b-undo"]=()=>{const p=activePage();if(!p)return;const h=hist[p.id];if(!h||!h.undo.length)return;

function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function occRects(page,excludeId){return page.widgets.filter(w=>w.id!==excludeId).map(w=>({x:w.x,y:w.y,w:w.w,h:w.h}))}
function fits(page,r,excludeId){if(r.x<0||r.y<0||r.x+r.w>12)return false;return!occRects(page,excludeId).some(o=>rectsOverlap(r,o))}
function freeSpot(page,w,h){for(let y=0;y<30;y++)for(let x=0;x<=12-w;x++){const r={x,y,w,h};if(fits(page,r))return r}return{x:0,y:30,w,h}}
function widgetDefaults(type){
  if(type==="counter")return{value:128,label:""};
  if(type==="checklist")return{items:state.lang==="ru"?[{t:"Первый пункт",done:false},{t:"Второй пункт",done:true}]:[{t:"First item",done:false},{t:"Second item",done:true}]};
  if(type==="kpi")return{metric:"revenue"};
  if(type==="chart")return{series:"revenue"};
  return{};
}

function kpiMetric(key){
  const won=state.deals.filter(d=>d.stage==="won").length,lost=state.deals.filter(d=>d.stage==="lost").length;
  const map={
    revenue:{l:t("dash.kpi.revenue"),num:monthRevenue(),fmt:n=>fmtMoneyShort(n),d:"+12.4%"},
    deals:{l:t("dash.kpi.deals"),num:openDeals().length,fmt:n=>String(Math.round(n)),d:"+3"},
    clients:{l:t("dash.kpi.clients"),num:state.companies.length,fmt:n=>String(Math.round(n)),d:"+2"},
    tasks:{l:t("dash.kpi.tasks"),num:state.tasks.filter(x=>x.status!=="done"&&x.due<=todayISO()).length,fmt:n=>String(Math.round(n)),d:""},
    won:{l:state.lang==="ru"?"Выиграно":"Won",num:won,fmt:n=>String(Math.round(n)),d:"+9%"},
    conversion:{l:state.lang==="ru"?"Конверсия":"Conversion",num:(won+lost?Math.round(won/(won+lost)*100):0),fmt:n=>Math.round(n)+"%",d:""}
  };
  const m=map[key]||map.revenue;m.v=m.fmt(m.num);return m;
}
function chartSeries(key){
  if(key==="deals"){const ids=allStageIds().concat(["lost"]);return{labels:ids.map(s=>stageLabel(s).slice(0,3)),data:ids.map(s=>state.deals.filter(d=>d.stage===s).length*10+4)}}
  if(key==="tasks")return{labels:["W1","W2","W3","W4","W5","W6","W7","W8"],data:[3,5,4,7,6,9,8,state.tasks.filter(x=>x.status==="done").length+2]};
  const wr=weeklyRevenue();
  return{labels:wr.map((_,i)=>{const d=new Date(Date.now()-(11-i)*7*864e5);return d.toLocaleDateString(state.lang==="ru"?"ru-RU":"en-US",{day:"numeric",month:"short"})}),data:wr};
}

  else if(w.type==="chart"){const cs=chartSeries(p.series);areaChart(body,cs.labels,cs.data);body.style.padding="4px"}
  else if(w.type==="funnel"){renderFunnel(body)}
  else if(w.type==="deals"){body.innerHTML=openDeals().slice(0,5).map(d=>'<div class="act-item" style="padding:6px 4px"><div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.title)+'</div><span class="mono small">'+fmtMoneyShort(d.value)+"</span></div>").join("")}
  else if(w.type==="tasks"){const open=state.tasks.filter(x=>x.status!=="done").slice(0,5);body.innerHTML=open.length?open.map(tk=>'<div class="act-item" style="padding:6px 4px"><div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(tk.title)+'</div><span class="small muted mono">'+fmtDate(tk.due)+"</span></div>").join(""):'<div class="small muted">'+t("empty.tasks")+"</div>"}
  else if(w.type==="note"){body.innerHTML='<textarea class="input" style="height:100%;border:none;background:transparent;resize:none" placeholder="…">'+(p.text?esc(p.text):"")+"</textarea>";
    body.querySelector("textarea").addEventListener("input",debounce(e=>{w.props.text=e.target.value;save()},400))}
  else if(w.type==="progress"){const won=state.deals.filter(d=>d.stage==="won").length,all=state.deals.length||1;const pct=Math.round(won/all*100);
    body.innerHTML='<div class="kpi-label">'+(state.lang==="ru"?"Выиграно сделок":"Deals won")+'</div><div class="kpi-value" style="font-size:22px">'+pct+'%</div><div class="progress" style="margin-top:8px"><i style="width:'+pct+'%"></i></div>'}
  else if(w.type==="text"){body.innerHTML=p.text?('<div style="font-size:12.5px;line-height:1.55;color:var(--text-2)">'+esc(p.text).replace(/\n/g,"<br>")+"</div>"):'<div class="small muted">'+(state.lang==="ru"?"Текстовый блок — настройте через карандаш":"Text block — edit via pencil")+"</div>"}
  else if(w.type==="heading"){body.innerHTML='<div style="font-size:'+(w.h<=1?"15px":"20px")+';font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;height:100%">'+(p.text?esc(p.text):(state.lang==="ru"?"Заголовок раздела":"Section heading"))+"</div>"}

function bwMove(e,w,elw,grid){
  if(e.target.closest(".bw-tools"))return;
  e.preventDefault();
  const page=activePage();const gr=grid.getBoundingClientRect();
  const cellW=gr.width/12,cellH=CELL;
  const step=()=>page.snap?1:0.5;
  let moved=false;
  function cand(ev){
    let nx=(ev.clientX-gr.left)/cellW-w.w/2,ny=(ev.clientY-gr.top)/cellH-w.h/2;
    nx=Math.max(0,Math.min(12-w.w,Math.round(nx/step())*step()));
    ny=Math.max(0,Math.round(ny/step())*step());
    return{nx,ny};
  }
  function move(ev){
    moved=true;elw.classList.add("dragging");
    const{nx,ny}=cand(ev);
    if(page.snap){
      elw.style.gridColumn=(nx+1)+" / span "+w.w;elw.style.gridRow=(ny+1)+" / span "+w.h;
      elw.classList.toggle("bad",!fits(page,{x:nx,y:ny,w:w.w,h:w.h},w.id));
    }else{
      elw.style.left="calc("+(nx/12*100)+"% + 6px)";elw.style.top=(ny*CELL+6)+"px";
    }
    elw.dataset.nx=nx;elw.dataset.ny=ny;
  }
  function up(){
    document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);
    elw.classList.remove("dragging","bad");
    if(moved){
      const nx=parseFloat(elw.dataset.nx||w.x),ny=parseFloat(elw.dataset.ny||w.y);
      if(!page.snap||fits(page,{x:nx,y:ny,w:w.w,h:w.h},w.id)){
        if(nx!==w.x||ny!==w.y){pushHist(page);w.x=nx;w.y=ny;save()}
      }
      renderView();
    }
  }
  document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);
}
function bwResize(e,w,elw,grid){
  e.preventDefault();e.stopPropagation();
  const page=activePage();const gr=grid.getBoundingClientRect();
  const cellW=gr.width/12,cellH=CELL;
  const step=()=>page.snap?1:0.5;
  function move(ev){
    let nw=Math.max(2,Math.min(12-w.x,Math.round(((ev.clientX-gr.left)/cellW-w.x)/step())*step()));
    let nh=Math.max(1,Math.min(10,Math.round(((ev.clientY-gr.top)/cellH-w.y)/step())*step()));
    if(page.snap){
      elw.style.gridColumn=(w.x+1)+" / span "+nw;elw.style.gridRow=(w.y+1)+" / span "+nh;
      elw.classList.toggle("bad",!fits(page,{x:w.x,y:w.y,w:nw,h:nh},w.id));
    }else{
      elw.style.width="calc("+(nw/12*100)+"% - 12px)";elw.style.height=(nh*CELL-12)+"px";
    }
    elw.dataset.nw=nw;elw.dataset.nh=nh;
  }
  function up(){
    document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);
    elw.classList.remove("bad");
    const nw=parseFloat(elw.dataset.nw||w.w),nh=parseFloat(elw.dataset.nh||w.h);
    if(!page.snap||fits(page,{x:w.x,y:w.y,w:nw,h:nh},w.id)){
      if(nw!==w.w||nh!==w.h){pushHist(page);w.w=nw;w.h=nh;save()}
    }
    renderView();
  }
  document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);
}

/* ---------- Layer: drawer / modal / toast ---------- */
function layer(){return $("#layer")}
let ovlGen=0;
function openDrawer(headHtml,bodyHtml,footHtml){
  closeOverlays();
  const gen=++ovlGen;
  layer().innerHTML='<div class="overlay" data-action="ovl-close"></div>'
    +'<aside class="drawer"><div class="drawer-head">'+headHtml+'<button class="x-btn" data-action="ovl-close">'+icon("x",16)+'</button></div>'
    +'<div class="drawer-body">'+bodyHtml+"</div>"
    +(footHtml?'<div class="drawer-foot">'+footHtml+"</div>":"")+"</aside>";
  requestAnimationFrame(()=>{if(gen!==ovlGen)return;const ov=$(".overlay",layer()),dr=$(".drawer",layer());if(ov)ov.classList.add("open");if(dr)dr.classList.add("open")});
}
function openModal(title,bodyHtml,footHtml){
  closeOverlays();
  const gen=++ovlGen;
  layer().innerHTML='<div class="overlay" data-action="ovl-close"></div>'
    +'<div class="modal-wrap"><div class="modal"><div class="modal-head"><div class="modal-title">'+esc(title)+'</div><button class="x-btn" data-action="ovl-close">'+icon("x",16)+"</button></div>"
    +'<div class="modal-body">'+bodyHtml+"</div>"
    +(footHtml?'<div class="modal-foot">'+footHtml+"</div>":"")+"</div></div>";
  requestAnimationFrame(()=>{if(gen!==ovlGen)return;const ov=$(".overlay",layer()),md=$(".modal",layer());if(ov)ov.classList.add("open");if(md)md.classList.add("open")});
}
function closeOverlays(){
  ovlGen++;
  const l=layer();
  $$(".overlay",l).forEach(o=>o.classList.remove("open"));
  $$(".drawer,.modal",l).forEach(o=>o.classList.remove("open"));
  setTimeout(()=>{const l2=layer();if(!$(".open",l2))l2.innerHTML=""},240);
}
function closeDrawer(){closeOverlays()}

ACTIONS["ovl-close"]=()=>closeOverlays();

function toast(msg,type){
  let box=$(".toasts");if(!box){box=el("div","toasts");document.body.appendChild(box)}
  const ic=type==="ok"?"check":type==="err"?"x":"info";
  const t=el("div","toast "+(type||"info"),'<span class="t-ico">'+icon(ic,16)+"</span><span>"+esc(msg)+"</span>");
  box.appendChild(t);

}

let palOpen=false,palSel=0,palItems=[];
function paletteData(q){
  q=(q||"").toLowerCase().trim();
  const items=[];
  const navs=NAV_MAIN.concat(NAV_WS).map(n=>({kind:"nav",icon:n[1],label:t("pal.go")+": "+t("nav."+n[0]),hint:"↵",run:()=>navigate(n[0]),match:t("nav."+n[0]).toLowerCase()}));
  const acts=[["new-deal","funnel","a.new_deal"],["new-task","check","a.new_task"],["new-client","users","a.new_client"],["new-invoice","doc","a.new_invoice"],["new-entity","db","a.new_entity"],["toggle-theme","moon","set.theme"],["toggle-lang","globe","set.lang"]]
    .map(x=>({kind:"act",icon:x[1],label:t(x[2]),hint:"",run:()=>ACTIONS[x[0]]({dataset:{}}),match:t(x[2]).toLowerCase()}));
  if(!q)return navs.concat(acts);
  const found=[];
  const push=(arr,kind,ic,mk)=>arr.forEach(x=>{const s=mk(x);if(s.toLowerCase().includes(q)&&found.length<8)found.push({kind,icon:ic,label:s,hint:"",run:x._run})});
  push(state.deals.map(d=>({_run:()=>{navigate("deals");setTimeout(()=>openDealDrawer(d.id),80)},_s:d.title})),"deal","funnel",x=>x._s);
  push(state.companies.map(c=>({_run:()=>{navigate("clients")},_s:c.name})),"co","users",x=>x._s);
  push(state.tasks.filter(x=>x.status!=="done").map(x=>({_run:()=>navigate("tasks"),_s:x.title})),"task","check",x=>x._s);
  return navs.concat(acts).filter(i=>i.match.includes(q)).concat(found).slice(0,12);
}
function openPalette(){
  if(palOpen)return;palOpen=true;palSel=0;
  closeOverlays();
  const w=el("div");w.id="pal-wrap";
  w.innerHTML='<div class="overlay open" data-action="pal-close" style="z-index:99"></div>'
    +'<div class="palette"><div class="palette-input">'+icon("search",17)+'<input id="pal-input" placeholder="'+t("pal.placeholder")+'" autocomplete="off"><kbd>esc</kbd></div><div class="palette-list" id="pal-list"></div></div>';
  document.body.appendChild(w);
  const inp=$("#pal-input");
  inp.addEventListener("input",()=>{palSel=0;renderPalList(inp.value)});
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);paintPalSel()}
    else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);paintPalSel()}
    else if(e.key==="Enter"){e.preventDefault();const it=palItems[palSel];if(it){closePalette();it.run()}}
  });
  renderPalList("");
  setTimeout(()=>inp.focus(),40);
}
function renderPalList(q){
  palItems=paletteData(q);
  const list=$("#pal-list");if(!list)return;
  if(!palItems.length){list.innerHTML='<div class="pal-group">'+t("empty.search")+' «'+esc(q)+'»</div>';return}
  list.innerHTML='<div class="pal-group">'+t("pal.nav")+" · "+t("pal.actions")+"</div>"
    +palItems.map((it,i)=>'<div class="pal-item'+(i===palSel?" sel":"")+'" data-pi="'+i+'"><span class="p-ico">'+icon(it.icon,16)+'</span><span>'+esc(it.label)+'</span><span class="p-hint">'+it.hint+"</span></div>").join("");
  $$("#pal-list .pal-item").forEach(p=>{
    p.addEventListener("click",()=>{const it=palItems[parseInt(p.dataset.pi,10)];closePalette();if(it)it.run()});
    p.addEventListener("mousemove",()=>{palSel=parseInt(p.dataset.pi,10);paintPalSel()});
  });
}
function paintPalSel(){$$("#pal-list .pal-item").forEach((p,i)=>p.classList.toggle("sel",i===palSel))}
function closePalette(){palOpen=false;const w=$("#pal-wrap");if(w)w.remove()}
ACTIONS["open-palette"]=()=>openPalette();

function aiAnswer(q){
  const ru=state.lang==="ru";const s=q.toLowerCase();
  const has=(...ws)=>ws.some(w=>s.includes(w));
  if(has("создай задачу","создать задачу","create task","new task")){
    const title=q.replace(/^.*?[:：]\s*/,"").trim()||q;
    state.tasks.unshift({id:uid("tk"),title:title.charAt(0).toUpperCase()+title.slice(1),status:"todo",priority:"mid",due:addDaysISO(todayISO(),1),owner:state.user.name,dealId:null,createdAt:todayISO()});
    save();renderShell();if(state.route==="tasks")renderView();
    actLog("task",(ru?"создана задача":"task created")+" · "+title);
    return ru?"Готово — задача «"+title+"» создана со сроком на завтра. Посмотреть можно в разделе «Задачи».":"Done — task “"+title+"” created, due tomorrow. See the Tasks section.";
  }
  if(has("создай сделку","создать сделку","create deal","new deal")){
    const m=s.match(/(\d[\d\s]*)(k|к|m|м)?/);
    let val=100000;if(m){val=parseInt(m[1].replace(/\s/g,""),10);if(m[2])val*= (m[2]==="m"||m[2]==="м")?1e6:1e3}
    const title=q.replace(/^.*?[:：]\s*/,"").replace(/[\d\s]+(k|к|m|м)?/i,"").trim()|| (ru?"Новая сделка":"New deal");
    const co=state.companies[0];
    state.deals.unshift({id:uid("dl"),title:title.charAt(0).toUpperCase()+title.slice(1),companyId:co.id,contactId:state.contacts[0].id,value:val,stage:"lead",prob:10,owner:state.user.name,source:"METRIC AI",createdAt:todayISO(),updatedAt:todayISO()});
    save();renderShell();if(state.route==="deals")renderView();
    actLog("deal",(ru?"создана сделка":"deal created")+" · "+title);
    return ru?"Сделка «"+title+"» на "+fmtMoney(val)+" добавлена в этап «Лид». Удачи с ней!":"Deal “"+title+"” worth "+fmtMoney(val)+" added to Lead stage. Good luck!";
  }
  if(has("просроч","overdue")){
    const tt=state.tasks.filter(x=>x.status!=="done"&&x.due<todayISO());
    const ii=state.invoices.filter(x=>x.status==="overdue");
    if(!tt.length&&!ii.length)return ru?"Просрочек нет — всё под контролем. Так держать!":"No overdue items — everything is under control. Keep it up!";
    let r=ru?"Есть просрочки:\n":"Overdue items:\n";
    tt.slice(0,4).forEach(x=>r+="• "+x.title+" ("+fmtDate(x.due)+")\n");
    ii.slice(0,3).forEach(x=>r+="• "+(ru?"Счёт ":"Invoice ")+x.number+" — "+fmtMoney(x.amount)+"\n");
    return r.trim();
  }
  if(has("сводка","недел","summary","week","итог")){
    const won=state.deals.filter(d=>d.stage==="won").length;
    const open=openDeals().length;
    const done=state.tasks.filter(x=>x.status==="done").length;
    const rev=monthRevenue();
    return ru
      ?"Сводка по платформе:\n• Выручка: "+fmtMoney(rev)+"\n• Активные сделки: "+open+"\n• Выиграно всего: "+won+"\n• Закрыто задач: "+done+" из "+state.tasks.length+"\nРекомендация: сфокусируйтесь на "+Math.max(1,state.tasks.filter(x=>x.status!=="done"&&x.due<todayISO()).length)+" просроченных задачах."
      :"Platform summary:\n• Revenue: "+fmtMoney(rev)+"\n• Active deals: "+open+"\n• Won total: "+won+"\n• Tasks done: "+done+" of "+state.tasks.length+"\nTip: focus on the "+Math.max(1,state.tasks.filter(x=>x.status!=="done"&&x.due<todayISO()).length)+" overdue tasks.";
  }
  if(has("топ","top","лучш")){
    const top=state.deals.slice().sort((a,b)=>b.value-a.value).slice(0,5);
    return (ru?"Топ-5 сделок по сумме:\n":"Top 5 deals by value:\n")+top.map((d,i)=>(i+1)+". "+d.title+" — "+fmtMoneyShort(d.value)+" ("+t("st."+d.stage)+")").join("\n");
  }
  if(has("выручк","revenue","доход","продаж")){
    const rev=monthRevenue();const open=openDeals();
    const weighted=open.reduce((sum,d)=>sum+d.value*d.prob/100,0);
    return ru
      ?"Оплаченная выручка: "+fmtMoney(rev)+". В работе "+open.length+" сделок; взвешенный прогноз по ним — "+fmtMoney(Math.round(weighted))+". Самый тяжёлый этап — «Переговоры»."
      :"Paid revenue: "+fmtMoney(rev)+". "+open.length+" deals in flight; weighted forecast "+fmtMoney(Math.round(weighted))+". Heaviest stage: Negotiation.";
  }
  if(has("воронк","pipeline","funnel","этап")){
    return (ru?"Воронка сейчас:\n":"Pipeline now:\n")+allStageIds().map(st=>{const ds=state.deals.filter(d=>d.stage===st);return "• "+stageLabel(st)+": "+ds.length+" · "+fmtMoneyShort(ds.reduce((x,d)=>x+d.value,0))}).join("\n");
  }
  if(has("письмо","email","letter","черновик","draft")){
    const d=state.deals.find(x=>x.stage==="negotiation")||openDeals()[0];
    if(!d)return ru?"Нет активных сделок для черновика.":"No active deals to draft for.";
    const co=companyById(d.companyId);
    return ru
      ?"Черновик для «"+(co?co.name:"")+"»:\n\nДобрый день!\n\nПо сделке «"+d.title+"» всё готово к финальному этапу. Предлагаю на этой неделе зафиксировать условия и выставить счёт на "+fmtMoney(d.value)+".\n\nС уважением, "+state.user.name
      :"Draft for "+(co?co.name:"")+":\n\nHello!\n\nThe deal “"+d.title+"” is ready for the final stage. Let's fix the terms this week and issue the invoice for "+fmtMoney(d.value)+".\n\nBest, "+state.user.name;
  }
  if(has("привет","hello","hi","добрый")){
    return ru?"Привет! Слежу за показателями — всё в норме. Спросите про выручку, воронку или попросите создать задачу.":"Hi! Keeping an eye on the numbers — all good. Ask about revenue, the pipeline, or have me create a task.";
  }
  return ru
    ?"Я умею: сводка за неделю, выручка и прогноз, состояние воронки, просроченные задачи, топ-сделки, черновик письма, создание задач и сделок («создай задачу: …»). Что сделать?"
    :"I can: weekly summary, revenue & forecast, pipeline status, overdue tasks, top deals, email drafts, and creating tasks/deals (“create task: …”). What do you need?";
}

      +'<div class="card rise" style="margin-bottom:16px"><div class="card-head"><div class="card-title">'+esc(state.user.name)+'</div></div><div class="card-pad" style="padding-top:10px">'

      +"</div></div>"

        +'<div class="set-row"><div><div class="set-name">'+t("set.theme")+'</div><div class="set-sub">'+t("set.theme.sub")+'</div></div><button class="switch'+(state.theme==="dark"?" on":"")+'" data-action="toggle-theme"></button></div>'
        +'<div class="set-row"><div><div class="set-name">'+t("set.lang")+'</div><div class="set-sub">'+t("set.lang.sub")+'</div></div><div class="seg"><button class="'+(state.lang==="ru"?"on":"")+'" data-action="set-lang" data-l="ru">RU</button><button class="'+(state.lang==="en"?"on":"")+'" data-action="set-lang" data-l="en">EN</button></div></div>'
      +"</div>"
    +"</div>"
    +'<div>'
      +'<div class="card rise" style="animation-delay:100ms;margin-bottom:16px"><div class="card-head"><div class="card-title">'+t("set.shortcuts")+"</div></div>"
        +'<div class="card-pad" style="padding-top:10px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px">'
        +sc.map(s=>'<div class="flex" style="justify-content:space-between"><span class="small muted">'+esc(s[1])+'</span><kbd>'+s[0]+"</kbd></div>").join("")
        +"</div></div></div>"
      +'<div class="card rise" style="animation-delay:140ms;margin-bottom:16px"><div class="card-head"><div class="card-title">'+t("set.data")+"</div></div>"
        +'<div class="set-row"><div><div class="set-name">'+t("a.reset")+'</div><div class="set-sub">'+t("set.reset.sub")+'</div></div><button class="btn btn-danger btn-sm" data-action="reset-demo">'+t("a.reset")+"</button></div>"
      +"</div>"
      +'<div class="card rise" style="animation-delay:180ms"><div class="card-head"><div class="card-title">'+t("set.about")+"</div></div>"
        +'<div class="set-row"><div class="flex">'+LOGO+'<div><div class="set-name">METRIC</div><div class="set-sub">'+t("set.about.sub")+"</div></div></div></div>"
      +"</div>"
    +"</div></div>";
}};
ACTIONS["profile-save"]=()=>{state.user.name=$("#set-name").value||state.user.name;state.user.role=$("#set-role").value||state.user.role;save();renderShell();toast(t("t.saved"),"ok")};
ACTIONS["set-lang"]=(a)=>{if(state.lang!==a.dataset.l){state.lang=a.dataset.l;save();renderShell();renderView()}};
ACTIONS["reset-demo"]=()=>{
  openModal(t("a.reset"),'<div class="small">'+t("set.reset.sub")+"</div>",
    '<button class="btn btn-ghost btn-sm" data-action="modal-close">'+t("a.cancel")+'</button><button class="btn btn-danger btn-sm" data-action="reset-confirm">'+t("a.reset")+"</button>");
};
ACTIONS["reset-confirm"]=()=>{try{localStorage.removeItem(LS_KEY)}catch(e){};location.reload()};
/* ---------- Keyboard shortcuts ---------- */
let gPending=false,gTimer=null;
document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName||"");
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();palOpen?closePalette():openPalette();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"&&state.route==="builder"&&!typing){e.preventDefault();e.shiftKey?ACTIONS["b-redo"]():ACTIONS["b-undo"]();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(gPending){
    gPending=false;clearTimeout(gTimer);
    const map={d:"dashboard",p:"deals",c:"clients",t:"tasks",a:"analytics",i:"invoices",b:"builder",s:"settings"};
    if(map[k]){e.preventDefault();navigate(map[k])}
    return;
  }
  if(k==="g"){gPending=true;gTimer=setTimeout(()=>gPending=false,700);return}
  if(k==="c"&&!palOpen){e.preventDefault();ACTIONS["create-menu"]()}
});
/* ---------- Live simulation ---------- */
function startLive(){
  setInterval(()=>{
    if(document.hidden)return;
    const ru=state.lang==="ru";
    const pool=[
      ["deal",ru?"сделка обновлена · ":"deal updated · "],["task",ru?"новая задача · ":"new task · "],
      ["invoice",ru?"счёт оплачен · ":"invoice paid · "],["client",ru?"новый лид · ":"new lead · "]];
    const p=pick(pool);const co=pick(state.companies);
    actLog(p[0],p[1]+co.name);
    state.notifRead=false;save();
    const bell=$('[data-action="notif"]');
    if(bell&&!bell.querySelector(".dot"))bell.insertAdjacentHTML("beforeend",'<span class="dot"></span>');
    const da=$("#dash-act");if(da)renderActList(da,8);
  },42000);
}

// ===== KPI Dashboard Widget =====
function renderKPIWidget() {
  const kpiData = [
    { label: 'Выручка', value: '₽ 2.4M', change: '+12%', positive: true },
    { label: 'Сделки', value: '48', change: '+5', positive: true },
    { label: 'Конверсия', value: '24%', change: '-2%', positive: false },
    { label: 'LTV', value: '₽ 85K', change: '+8%', positive: true }
  ];

  const widget = document.createElement('div');
  widget.className = 'kpi-widget';
  widget.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0;padding:20px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)';
  widget.innerHTML = kpiData.map(k => `
    <div style="text-align:center;padding:16px;background:var(--panel-2);border-radius:var(--radius-s);transition:transform .2s" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform=''">
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">${k.label}</div>
      <div style="font-family:var(--font-ui);font-size:24px;font-weight:700;color:var(--text);margin-top:8px">${k.value}</div>
      <div style="font-family:var(--font-mono);font-size:12px;color:${k.positive?'var(--green)':'var(--red)'};margin-top:4px">${k.change}</div>
    </div>
  `).join('');

  const dash = document.querySelector('[data-route="dashboard"] .dash-body');
  if (dash) dash.insertBefore(widget, dash.firstChild);
}

// ===== Deal Pipeline Visualization =====
function renderPipeline() {
  const stages = [
    { name: 'Лид', count: 24, color: 'var(--muted)' },
    { name: 'Встреча', count: 18, color: 'var(--blue)' },
    { name: 'Предложение', count: 12, color: 'var(--amber)' },
    { name: 'Переговоры', count: 8, color: 'var(--violet)' },
    { name: 'Закрыто', count: 6, color: 'var(--green)' }
  ];

  const pipeline = document.createElement('div');
  pipeline.className = 'pipeline-viz';
  pipeline.style.cssText = 'margin:24px 0;padding:24px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)';
  pipeline.innerHTML = `
    <div style="font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--text);margin-bottom:16px">Воронка продаж</div>
    <div style="display:flex;align-items:flex-end;gap:8px;height:120px">
      ${stages.map((s,i) => `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">${s.count}</div>
          <div style="width:100%;background:${s.color};border-radius:4px 4px 0 0;transition:height .6s ease;height:${(s.count/24)*100}px;opacity:${0.4+(i*0.15)}"></div>
          <div style="font-family:var(--font-mono);font-size:9px;color:var(--muted);text-align:center">${s.name}</div>
        </div>
      `).join('')}
    </div>
  `;

  const dash = document.querySelector('[data-route="dashboard"] .dash-body');
  if (dash) dash.insertBefore(pipeline, dash.children[1]);
}

// ===== Activity Heatmap =====
function renderHeatmap() {
  const days = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const hours = ['9','11','13','15','17','19'];
  const heatmap = document.createElement('div');
  heatmap.className = 'activity-heatmap';
  heatmap.style.cssText = 'margin:24px 0;padding:24px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)';

  let cells = '';
  for (let h of hours) {
    cells += `<div style="display:flex;gap:4px;margin-bottom:4px">`;
    cells += `<div style="width:24px;font-family:var(--font-mono);font-size:10px;color:var(--muted);display:flex;align-items:center">${h}:00</div>`;
    for (let d of days) {
      const intensity = Math.random();
      const bg = intensity > 0.7 ? 'var(--accent)' : intensity > 0.4 ? 'var(--accent-soft-2)' : 'var(--panel-2)';
      cells += `<div style="flex:1;height:24px;background:${bg};border-radius:3px;transition:transform .2s" onmouseenter="this.style.transform='scale(1.1)'" onmouseleave="this.style.transform=''"></div>`;
    }
    cells += `</div>`;
  }

  heatmap.innerHTML = `
    <div style="font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--text);margin-bottom:16px">Активность команды</div>
    <div style="display:flex;gap:4px;margin-bottom:4px;margin-left:28px">
      ${days.map(d => `<div style="flex:1;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--muted)">${d}</div>`).join('')}
    </div>
    ${cells}
  `;

  const dash = document.querySelector('[data-route="dashboard"] .dash-body');
  if (dash) dash.appendChild(heatmap);
}

// ===== Enhanced Notifications =====
function enhancedNotifications() {
  const notifPanel = document.querySelector('[data-overlay="notif"]');
  if (!notifPanel) return;

  const quickActions = document.createElement('div');
  quickActions.style.cssText = 'padding:12px;border-top:1px solid var(--border);display:flex;gap:8px';
  quickActions.innerHTML = `
    <button style="flex:1;padding:8px;background:var(--accent-soft);border:none;border-radius:var(--radius-xs);font-family:var(--font-ui);font-size:12px;color:var(--accent);cursor:pointer">Отметить всё прочитанным</button>
    <button style="flex:1;padding:8px;background:var(--panel-2);border:none;border-radius:var(--radius-xs);font-family:var(--font-ui);font-size:12px;color:var(--text-2);cursor:pointer">Настройки</button>
  `;
  notifPanel.appendChild(quickActions);
}

// ===== Init enhancements =====
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    renderKPIWidget();
    renderPipeline();
    renderHeatmap();
    enhancedNotifications();
  }, 500);
});

})();
