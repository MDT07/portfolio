<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METRIC — Обзор</title>
<meta name="description" content="METRIC — платформа продуктовой аналитики. Демо-шаблон SaaS-дашборда.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ ТОКЕНЫ ============ */
:root{
  --bg:#0A0A0A;
  --panel:#111111;
  --hover:#1A1A1A;
  --border:#242424;
  --text:#EDEDED;
  --text-2:#A1A1A1;
  --text-3:#666666;
  --accent:#0070F3;
  --accent-hover:#0060DF;
  --accent-bg:#0C2D4D;
  --success:#17C964;
  --error:#F31260;
  --warning:#F5A524;
  --r6:6px;
  --r8:8px;
  --sidebar-w:240px;
  --sidebar-w-min:64px;
  --topbar-h:57px;
  --ease:ease-out;
  --t-fast:150ms;
  --t-mid:240ms;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100%;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
::selection{background:var(--accent-bg);color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
a{color:inherit;text-decoration:none}

/* ============ ОБОЛОЧКА ============ */
.app{display:flex;min-height:100vh}

/* ---- Sidebar ---- */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;z-index:40;
  width:var(--sidebar-w);
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:width var(--t-mid) var(--ease);
  overflow:hidden;
}
.sb-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 16px 16px 20px;min-height:var(--topbar-h);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo-mark{
  width:24px;height:24px;flex-shrink:0;
  background:var(--accent);border-radius:var(--r6);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px;color:#fff;
}
.logo-word{font-weight:700;font-size:14px;letter-spacing:.1em;transition:opacity var(--t-fast) var(--ease)}
.sb-toggle{
  width:26px;height:26px;flex-shrink:0;border-radius:var(--r6);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);
}
.sb-toggle:hover{background:var(--hover);color:var(--text)}
.sb-toggle svg{transition:transform var(--t-mid) var(--ease)}

.sb-nav{flex:1;padding:16px 12px;overflow-y:auto}
.sb-section{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;
  color:var(--text-3);text-transform:uppercase;
  padding:0 10px;margin:0 0 8px;white-space:nowrap;
  transition:opacity var(--t-fast) var(--ease);
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:8px 10px;margin-bottom:2px;
  border-radius:var(--r6);color:var(--text-2);
  font-size:13.5px;font-weight:500;white-space:nowrap;text-align:left;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);
}
.nav-item svg{flex-shrink:0;color:var(--text-3);transition:color var(--t-fast) var(--ease)}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item:hover svg{color:var(--text-2)}
.nav-item.active{background:var(--hover);color:var(--text)}
.nav-item.active svg{color:var(--accent)}
.nav-label{transition:opacity var(--t-fast) var(--ease)}

.sb-foot{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.user-card{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:var(--r6);white-space:nowrap;
  transition:background var(--t-fast) var(--ease);cursor:pointer;
}
.user-card:hover{background:var(--hover)}
.avatar{
  width:30px;height:30px;flex-shrink:0;border-radius:50%;
  background:var(--accent-bg);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--text);
}
.user-meta{overflow:hidden;transition:opacity var(--t-fast) var(--ease)}
.user-name{font-size:13px;font-weight:500;line-height:1.3}
.user-plan{font-size:11px;color:var(--text-3);line-height:1.3}

/* Свёрнутый сайдбар */
body.sb-collapsed .sidebar{width:var(--sidebar-w-min)}
body.sb-collapsed .logo-word,
body.sb-collapsed .nav-label,
body.sb-collapsed .sb-section,
body.sb-collapsed .user-meta{opacity:0;pointer-events:none}
body.sb-collapsed .sb-head{padding:16px 0;justify-content:center}
body.sb-collapsed .sb-toggle svg{transform:rotate(180deg)}
body.sb-collapsed .nav-item{justify-content:center;padding:8px 0}
body.sb-collapsed .user-card{justify-content:center;padding:8px 0}
body.sb-collapsed .main{margin-left:var(--sidebar-w-min)}

/* ---- Main ---- */
.main{
  flex:1;min-width:0;margin-left:var(--sidebar-w);
  transition:margin-left var(--t-mid) var(--ease);
  display:flex;flex-direction:column;
}
.topbar{
  position:sticky;top:0;z-index:30;height:var(--topbar-h);
  display:flex;align-items:center;gap:16px;
  padding:0 24px;background:var(--bg);
  border-bottom:1px solid var(--border);
}
.page-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}

/* Сегментированный переключатель */
.seg{
  display:flex;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--r6);padding:2px;
}
.seg-btn{
  padding:4px 12px;border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
  color:var(--text-3);
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease);
}
.seg-btn:hover{color:var(--text-2)}
.seg-btn.active{background:var(--accent-bg);color:var(--text)}

/* Поиск */
.search{
  display:flex;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r6);
  padding:0 10px;height:32px;width:220px;
  transition:border-color var(--t-fast) var(--ease);
}
.search:focus-within{border-color:var(--accent)}
.search svg{color:var(--text-3);flex-shrink:0}
.search input{
  flex:1;min-width:0;background:none;border:none;outline:none;
  color:var(--text);font-size:13px;font-family:inherit;
}
.search input::placeholder{color:var(--text-3)}
.kbd{
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-3);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;flex-shrink:0;
}

/* ---- Контент ---- */
.content{padding:24px;max-width:1500px;width:100%;margin:0 auto}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r8);
  animation:fadeUp .3s var(--ease) both;
}
.kpi{padding:16px 18px 14px}
.kpi:nth-child(2){animation-delay:.05s}
.kpi:nth-child(3){animation-delay:.1s}
.kpi:nth-child(4){animation-delay:.15s}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kpi-label{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);
}
.delta{
  display:inline-flex;align-items:center;gap:3px;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;
  padding:2px 6px;border-radius:4px;
}
.delta.up{color:var(--success)}
.delta.down{color:var(--error)}
.kpi-value{
  font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.2;
  font-variant-numeric:tabular-nums;margin-bottom:10px;
}
.kpi-value .unit{font-size:15px;color:var(--text-2);font-weight:500;margin-left:2px}
.spark{display:block;width:100%;height:32px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.spark .spark-base{stroke:var(--border);stroke-width:1;stroke-dasharray:2 3}

/* Сетка: график+таблица | рейл */
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.col-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.col-rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.col-main>.card:nth-child(1){animation-delay:.2s}
.col-main>.card:nth-child(2){animation-delay:.25s}
.col-rail>.card:nth-child(1){animation-delay:.3s}
.col-rail>.card:nth-child(2){animation-delay:.35s}

.card-head{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--border);
}
.card-title{font-size:13.5px;font-weight:600}
.card-head-right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* Live-бейдж */
.live{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;
  letter-spacing:.08em;color:var(--text-3);text-transform:uppercase;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* График */
.chart-wrap{position:relative;padding:12px 8px 4px;transition:opacity var(--t-fast) var(--ease)}
.chart-wrap.fading{opacity:0}
#chart{display:block;width:100%}
#chart .grid-line{stroke:var(--border);stroke-width:.5}
#chart .axis-label{fill:var(--text-3);font-family:'JetBrains Mono',monospace;font-size:10px}
#chart .line{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
#chart .area{fill:var(--accent);fill-opacity:.07;stroke:none}
#chart .end-dot{fill:var(--accent)}
#chart .end-ring{fill:none;stroke:var(--accent);stroke-opacity:.3;stroke-width:1}
#chart .cross{stroke:var(--text-3);stroke-width:.5;stroke-dasharray:3 3}
#chart .hover-dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
#chart .overlay{fill:transparent}
.chart-tip{
  position:absolute;pointer-events:none;z-index:5;
  background:var(--hover);border:1px solid var(--border);border-radius:var(--r6);
  padding:8px 10px;min-width:110px;
  opacity:0;transform:translateY(2px);
  transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);
}
.chart-tip.show{opacity:1;transform:translateY(0)}
.tip-date{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-3);margin-bottom:3px}
.tip-value{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tip-metric{font-size:11px;color:var(--text-2);margin-top:1px}

/* Таблица */
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 20px;text-align:left;white-space:nowrap}
th{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);
  border-bottom:1px solid var(--border);
  user-select:none;cursor:pointer;
  transition:color var(--t-fast) var(--ease);
}
th:hover{color:var(--text-2)}
th .sort-arrow{display:inline-block;margin-left:5px;font-size:8px;opacity:0;transition:opacity var(--t-fast) var(--ease)}
th.sorted .sort-arrow{opacity:1}
th.num,td.num{text-align:right}
td{border-bottom:1px solid var(--hover);font-size:13px}
tbody tr{transition:background var(--t-fast) var(--ease)}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:none}
td.event-name{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text)}
td .t-delta{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
td .t-delta.up{color:var(--success)}
td .t-delta.down{color:var(--error)}
td .t-count{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-variant-numeric:tabular-nums}
.share-cell{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.share-bar{width:56px;height:3px;background:var(--hover);border-radius:2px;overflow:hidden;flex-shrink:0}
.share-fill{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s var(--ease)}
.share-pct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}

/* Воронка */
.funnel{padding:8px 20px 18px}
.f-stage{margin-top:14px}
.f-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.f-name{font-size:12.5px;font-weight:500;color:var(--text-2)}
.f-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.f-pct{color:var(--text-3);font-weight:400;margin-left:6px;font-size:11px}
.f-track{height:22px;background:var(--hover);border-radius:var(--r6);overflow:hidden}
.f-fill{
  height:100%;background:var(--accent-bg);border-right:1px solid var(--accent);
  border-radius:var(--r6) 0 0 var(--r6);
  width:0;transition:width .5s var(--ease);
}
.f-conv{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-3);
  margin-top:6px;padding-left:2px;
}

/* Система */
.sys-list{padding:8px 20px 16px}
.sys-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--hover);
}
.sys-row:last-child{border-bottom:none}
.sys-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sys-dot.ok{background:var(--success)}
.sys-dot.warn{background:var(--warning)}
.sys-name{font-size:13px;font-weight:500}
.sys-status{font-size:11px;color:var(--text-3);margin-top:1px}
.sys-right{margin-left:auto;text-align:right}
.sys-uptime{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.sys-lat{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-top:1px}

/* Footer */
.footer{
  margin-top:auto;border-top:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:12px;color:var(--text-3);
}
.footer .mono{font-size:11px}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

/* ---- Адаптив ---- */
@media (max-width:1200px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-main{grid-template-columns:minmax(0,1fr)}
  .col-rail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (max-width:860px){
  .col-rail{grid-template-columns:minmax(0,1fr)}
  .search{width:150px}
  .search .kbd{display:none}
}
@media (max-width:640px){
  .kpis{grid-template-columns:minmax(0,1fr)}
  .content{padding:16px}
  .search{display:none}
}
</style>
</head>
<body>

<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="logo">
        <span class="logo-mark">M</span>
        <span class="logo-word">METRIC</span>
      </div>
      <button class="sb-toggle" id="sbToggle" aria-label="Свернуть меню" title="Свернуть меню">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
      </button>
    </div>

    <nav class="sb-nav">
      <div class="sb-section">Платформа</div>
      <button class="nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="nav-label">Обзор</span>
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg>
        <span class="nav-label">События</span>
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5L3 4z"/></svg>
        <span class="nav-label">Воронки</span>
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1 21 6l-4 3.9"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="m7 21.9-4-3.9 4-3.9"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        <span class="nav-label">Retention</span>
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7l-5-5z"/><path d="M14 2v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
        <span class="nav-label">Отчёты</span>
      </button>
      <button class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9"/><path d="M17 6h3"/><circle cx="15" cy="6" r="2"/><path d="M4 12h3"/><path d="M11 12h9"/><circle cx="9" cy="12" r="2"/><path d="M4 18h13"/><path d="M21 18h0"/><circle cx="19" cy="18" r="2"/></svg>
        <span class="nav-label">Настройки</span>
      </button>
    </nav>

    <div class="sb-foot">
      <div class="user-card">
        <span class="avatar">АВ</span>
        <span class="user-meta">
          <span class="user-name">Анна Ветрова</span><br>
          <span class="user-plan">Pro-план · админ</span>
        </span>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">

    <header class="topbar">
      <h1 class="page-title">Обзор</h1>
      <div class="topbar-right">
        <div class="seg" id="periodSeg" role="tablist" aria-label="Период">
          <button class="seg-btn" data-period="7">7д</button>
          <button class="seg-btn active" data-period="30">30д</button>
          <button class="seg-btn" data-period="90">90д</button>
        </div>
        <label class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" placeholder="Поиск…" aria-label="Поиск">
          <span class="kbd">⌘K</span>
        </label>
        <span class="avatar" title="Анна Ветрова">АВ</span>
      </div>
    </header>

    <div class="content">

      <!-- KPI -->
      <section class="kpis" id="kpis" aria-label="Ключевые метрики"></section>

      <div class="grid-main">
        <div class="col-main">

<script>
'use strict';
(function(){

/* ================= УТИЛИТЫ ================= */

var $ = function(s){ return document.querySelector(s); };

/* Детерминированный ГПСЧ — данные одинаковые при каждом открытии */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var fmtInt = new Intl.NumberFormat('ru-RU');
function fmtCompact(v){
  if(v >= 1e6) return (v/1e6).toFixed(1).replace('.', ',').replace(',0','') + 'M';
  if(v >= 1e3) return Math.round(v/1e3) + 'K';
  return String(Math.round(v));
}
function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

var MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmtDate(d){ return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate() + n); return r; }

function animateValue(duration, onUpdate, onDone){
  var start = performance.now();
  function frame(now){
    var t = Math.min((now - start) / duration, 1);
    onUpdate(easeOutCubic(t));
    if(t < 1) requestAnimationFrame(frame);
    else if(onDone) onDone();
  }
  requestAnimationFrame(frame);
}

/* ================= ДАННЫЕ ================= */

/* Конфиг метрик графика: база, волатильность, тренд за период, seed */
var METRICS = {
  users:    { label:'Пользователи', base:11800,  vol:0.055, trend:0.16, seed:101 },
  sessions: { label:'Сессии',       base:16400,  vol:0.065, trend:0.19, seed:202 },
  events:   { label:'События',      base:148000, vol:0.075, trend:0.24, seed:303 }
};
var PERIODS = [7, 30, 90];

/* Состояние ряда: даты + значения по каждой метрике (для live-сдвига) */
var state = {
  period: 30,
  metric: 'users',
  dates: [],
  series: {},   // metric -> [values]
  rng: {}       // metric -> продолжение ГПСЧ для live-тиков
};

function genValue(cfg, rng, i, n, date){
  var dow = date.getDay();
  var weekend = (dow === 0 || dow === 6) ? 0.82 : 1;
  var trendF = 1 + cfg.trend * (i / Math.max(n - 1, 1));
  var noise = 1 + cfg.vol * (rng() - 0.5) * 2;
  return Math.round(cfg.base * weekend * trendF * noise);
}

function buildSeries(period){
  var today = new Date();
  state.dates = [];
  state.series = {};
  state.rng = {};
  for(var i = period - 1; i >= 0; i--) state.dates.push(addDays(today, -i));
  Object.keys(METRICS).forEach(function(key){
    var cfg = METRICS[key];
    var rng = mulberry32(cfg.seed * 1000 + period);
    var arr = [];
    for(var j = 0; j < period; j++) arr.push(genValue(cfg, rng, j, period, state.dates[j]));
    state.series[key] = arr;
    state.rng[key] = rng;
  });
}

/* Live-тик: сдвигаем окно на один шаг, доставляем следующее значение из того же ГПСЧ */
function tickSeries(){
  state.dates.push(addDays(state.dates[state.dates.length - 1], 1));
  state.dates.shift();
  Object.keys(METRICS).forEach(function(key){
    var cfg = METRICS[key];
    var next = genValue(cfg, state.rng[key], state.period, state.period, state.dates[state.dates.length - 1]);
    state.series[key].push(next);
    state.series[key].shift();
  });
}

/* KPI */
var KPIS = [
  { id:'mau',    label:'MAU',         value:48392, decimals:0, unit:'',   delta:+8.2,  good:'up',   sparkSeed:11 },
  { id:'sticky', label:'DAU / MAU',   value:24.6,  decimals:1, unit:'%',  delta:+1.3,  good:'up',   sparkSeed:22 },
  { id:'conv',   label:'Конверсия',   value:3.84,  decimals:2, unit:'%',  delta:+0.6,  good:'up',   sparkSeed:33 },
  { id:'churn',  label:'Churn',       value:2.14,  decimals:2, unit:'%',  delta:-0.3,  good:'down', sparkSeed:44 }
];

/* Таблица событий */
var EVENTS = [
  { name:'page_view',        count:1482310, change:+6.4,  share:38.2 },
  { name:'button_click',     count:512804,  change:+11.2, share:13.2 },
  { name:'form_submit',      count:388145,  change:-2.3,  share:10.0 },
  { name:'session_start',    count:364990,  change:+5.8,  share:9.4  },
  { name:'video_play',       count:271440,  change:+18.9, share:7.0  },
  { name:'search_query',     count:232705,  change:+3.5,  share:6.0  },
  { name:'signup_completed', count:162894,  change:+8.7,  share:4.2  },
  { name:'checkout_started', count:147120,  change:-4.6,  share:3.8  },
  { name:'plan_upgraded',    count:89332,   change:+22.4, share:2.3  },
  { name:'api_key_created',  count:62010,   change:+9.9,  share:1.6  }
];

/* Воронка */
var FUNNEL = [
  { name:'Визит',       value:128400 },
  { name:'Регистрация', value:43910  },
  { name:'Активация',   value:24010  },
  { name:'Оплата',      value:8210   }
];

/* Система */
var SYSTEM = [
  { name:'API',      status:'ok',   statusText:'Operational',        uptime:'99.99%', lat:'42 ms'  },
  { name:'CDN',      status:'ok',   statusText:'Operational',        uptime:'100%',   lat:'12 ms'  },
  { name:'Database', status:'warn', statusText:'Повышенная задержка', uptime:'99.91%', lat:'210 ms' }
];

/* ================= KPI-КАРТОЧКИ ================= */

function sparklineData(seed){
  var rng = mulberry32(seed);
  var arr = [], v = 50;
  for(var i = 0; i < 14; i++){
    v += (rng() - 0.42) * 14;
    v = Math.max(15, Math.min(90, v));
    arr.push(v);
  }
  return arr;
}

function renderKPIs(){
  var wrap = $('#kpis');
  KPIS.forEach(function(k, idx){
    var spark = sparklineData(k.sparkSeed);
    var pts = spark.map(function(v, i){
      var x = (i / (spark.length - 1)) * 100;
      var y = 30 - ((v - 10) / 80) * 26;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var up = k.delta >= 0;
    var good = (k.good === 'up' && up) || (k.good === 'down' && !up);
    var card = document.createElement('div');
    card.className = 'card kpi';
    card.style.animationDelay = (idx * 0.05) + 's';
    card.innerHTML =
      '<div class="kpi-top">' +
        '<span class="kpi-label">' + k.label + '</span>' +
        '<span class="delta ' + (good ? 'up' : 'down') + '">' +
          (up ? '▲' : '▼') + ' ' + Math.abs(k.delta).toFixed(1).replace('.', ',') + '%' +
        '</span>' +
      '</div>' +
      '<div class="kpi-value"><span class="kpi-num" data-target="' + k.value + '" data-decimals="' + k.decimals + '">0</span>' +
      (k.unit ? '<span class="unit">' + k.unit + '</span>' : '') + '</div>' +
      '<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true">' +
        '<line class="spark-base" x1="0" y1="31" x2="100" y2="31"/>' +
        '<polyline points="' + pts + '"/>' +
      '</svg>';
    wrap.appendChild(card);
  });
}

/* Анимированные счётчики при загрузке */
function runCounters(){
  var nums = document.querySelectorAll('.kpi-num');
  nums.forEach(function(el, i){
    var target = parseFloat(el.dataset.target);
    var dec = parseInt(el.dataset.decimals, 10);
    setTimeout(function(){
      animateValue(900, function(t){
        var v = target * t;
        el.textContent = dec > 0
          ? v.toFixed(dec).replace('.', ',')
          : fmtInt.format(Math.round(v));
      });
    }, i * 80);
  });
}

/* ================= ГРАФИК ================= */

var chart = {
  svg: $('#chart'),
  wrap: $('#chartWrap'),
  tip: $('#chartTip'),
  values: [],       // отображаемые (анимируемые) значения
  labels: [],
  W: 0, H: 300,
  pad: { l: 46, r: 14, t: 14, b: 28 },
  yMax: 1,
  animating: false,

  /* «Красивый» максимум оси Y */
  niceMax: function(v){
    var pow = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / pow;
    var m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return m * pow;
  },

  x: function(i){
    var n = this.values.length;
    var w = this.W - this.pad.l - this.pad.r;
    return this.pad.l + (n <= 1 ? w / 2 : (i / (n - 1)) * w);
  },
  y: function(v){
    var h = this.H - this.pad.t - this.pad.b;
    return this.pad.t + h - (v / this.yMax) * h;
  },

  linePath: function(){
    var d = '';
    for(var i = 0; i < this.values.length; i++){
      d += (i === 0 ? 'M' : 'L') + this.x(i).toFixed(2) + ' ' + this.y(this.values[i]).toFixed(2);
    }
    return d;
  },
  areaPath: function(){
    var base = this.H - this.pad.b;
    return this.linePath() +
      'L' + this.x(this.values.length - 1).toFixed(2) + ' ' + base +
      'L' + this.x(0).toFixed(2) + ' ' + base + 'Z';
  },

  /* Полная перерисовка каркаса (сетка, оси) */
  buildFrame: function(){
    var self = this;
    this.W = this.wrap.clientWidth - 16;
    if(this.W < 200) this.W = 200;
    this.svg.setAttribute('width', this.W);
    this.svg.setAttribute('height', this.H);
    this.svg.setAttribute('viewBox', '0 0 ' + this.W + ' ' + this.H);
    var max = Math.max.apply(null, this.values);
    this.yMax = this.niceMax(max * 1.08);

    var html = '';
    /* горизонтальная сетка + подписи Y */
    var rows = 4;
    for(var r = 0; r <= rows; r++){
      var v = this.yMax * (r / rows);
      var yy = this.y(v);
      html += '<line class="grid-line" x1="' + this.pad.l + '" y1="' + yy + '" x2="' + (this.W - this.pad.r) + '" y2="' + yy + '"/>';
      html += '<text class="axis-label" x="' + (this.pad.l - 8) + '" y="' + (yy + 3) + '" text-anchor="end">' + fmtCompact(v) + '</text>';
    }
    /* подписи X — не более 6 тиков */
    var n = this.labels.length;
    var step = Math.max(1, Math.ceil(n / 6));
    for(var i = 0; i < n; i += step){
      html += '<text class="axis-label" x="' + this.x(i) + '" y="' + (this.H - 8) + '" text-anchor="middle">' + fmtDate(this.labels[i]) + '</text>';
    }
    /* слои данных */
    html += '<path class="area" id="cArea" d=""/>';
    html += '<path class="line" id="cLine" d=""/>';
    html += '<circle class="end-ring" id="cRing" r="5"/>';
    html += '<circle class="end-dot" id="cEnd" r="2.5"/>';
    /* кроссхаир */
    html += '<line class="cross" id="cCross" y1="' + this.pad.t + '" y2="' + (this.H - this.pad.b) + '" style="display:none"/>';
    html += '<circle class="hover-dot" id="cDot" r="3.5" style="display:none"/>';
    /* прозрачная зона захвата мыши */
    html += '<rect class="overlay" id="cOverlay" x="' + this.pad.l + '" y="0" width="' + (this.W - this.pad.l - this.pad.r) + '" height="' + this.H + '"/>';
    this.svg.innerHTML = html;

    $('#cOverlay').addEventListener('mousemove', function(e){ self.onHover(e); });
    $('#cOverlay').addEventListener('mouseleave', function(){ self.hideCross(); });
  },

  /* Обновить только path-ы (кадр анимации) */
  paint: function(){
    var line = $('#cLine'), area = $('#cArea');
    if(!line) return;
    line.setAttribute('d', this.linePath());
    area.setAttribute('d', this.areaPath());
    var li = this.values.length - 1;
    var ex = this.x(li), ey = this.y(this.values[li]);
    $('#cEnd').setAttribute('cx', ex); $('#cEnd').setAttribute('cy', ey);
    $('#cRing').setAttribute('cx', ex); $('#cRing').setAttribute('cy', ey);
  },

  /* Установить данные; morph-анимация, если число точек совпадает */
  setData: function(values, labels, morph){
    var self = this;
    var sameLen = this.values.length === values.length && this.values.length > 0;
    if(morph && sameLen){
      var from = this.values.slice();
      var to = values.slice();
      this.labels = labels;
      this.animating = true;
      animateValue(260, function(t){
        for(var i = 0; i < to.length; i++) self.values[i] = from[i] + (to[i] - from[i]) * t;
        self.paint();
      }, function(){ self.animating = false; });
    } else {
      this.values = values.slice();
      this.labels = labels;
      this.buildFrame();
      this.paint();
    }
  },

  /* Кроссхаир + тултип */
  onHover: function(e){
    if(!this.values.length) return;
    var rect = this.svg.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var n = this.values.length;
    var w = this.W - this.pad.l - this.pad.r;
    var idx = Math.round(((mx - this.pad.l) / w) * (n - 1));
    idx = Math.max(0, Math.min(n - 1, idx));
    var cx = this.x(idx), cy = this.y(this.values[idx]);

    var cross = $('#cCross'), dot = $('#cDot');
    cross.style.display = ''; dot.style.display = '';
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx);
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);

    var cfg = METRICS[state.metric];
    this.tip.innerHTML =
      '<div class="tip-date">' + fmtDate(this.labels[idx]) + '</div>' +
      '<div class="tip-value">' + fmtInt.format(this.values[idx]) + '</div>' +
      '<div class="tip-metric">' + cfg.label.toLowerCase() + '</div>';
    this.tip.classList.add('show');
    /* позиция тултипа с клампом по краям */
    var wrapRect = this.wrap.getBoundingClientRect();
    var tw = this.tip.offsetWidth, th = this.tip.offsetHeight;
    var left = cx + 8 + 14;              /* svg offset + отступ от точки */
    if(left + tw > wrapRect.width - 4) left = cx + 8 - tw - 14;
    var top = cy + 12 - th - 10;
    if(top < 4) top = cy + 12 + 12;
    this.tip.style.left = left + 'px';
    this.tip.style.top = top + 'px';
  },
  hideCross: function(){
    var cross = $('#cCross'), dot = $('#cDot');
    if(cross) cross.style.display = 'none';
    if(dot) dot.style.display = 'none';
    this.tip.classList.remove('show');
  }
};

/* ================= ТАБЛИЦА ================= */

var sortState = { key:'count', dir:'desc' };

function renderTable(){
  var body = $('#eventsBody');
  var rows = EVENTS.slice().sort(function(a, b){
    var k = sortState.key;
    var va = a[k], vb = b[k];
    var cmp = (typeof va === 'string') ? va.localeCompare(vb) : va - vb;
    return sortState.dir === 'asc' ? cmp : -cmp;
  });
  var maxShare = Math.max.apply(null, EVENTS.map(function(e){ return e.share; }));
  var html = '';
  rows.forEach(function(e){
    var up = e.change >= 0;
    html += '<tr>' +
      '<td class="event-name">' + e.name + '</td>' +
      '<td class="num"><span class="t-count">' + fmtInt.format(e.count) + '</span></td>' +
      '<td class="num"><span class="t-delta ' + (up ? 'up' : 'down') + '">' +
        (up ? '+' : '−') + Math.abs(e.change).toFixed(1).replace('.', ',') + '%</span></td>' +
      '<td class="num"><div class="share-cell">' +
        '<span class="share-bar"><span class="share-fill" style="width:' + (e.share / maxShare * 100).toFixed(0) + '%"></span></span>' +
        '<span class="share-pct">' + e.share.toFixed(1).replace('.', ',') + '%</span>' +
      '</div></td>' +
    '</tr>';
  });
  body.innerHTML = html;
}

function initTableSort(){
  var heads = document.querySelectorAll('#eventsTable th');
  heads.forEach(function(th){
    th.addEventListener('click', function(){
      var key = th.dataset.key;
      if(sortState.key === key){
        sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        sortState.key = key;
        sortState.dir = key === 'name' ? 'asc' : 'desc';
      }
      heads.forEach(function(h){
        h.classList.toggle('sorted', h.dataset.key === sortState.key);
        h.querySelector('.sort-arrow').textContent =
          h.dataset.key === sortState.key ? (sortState.dir === 'asc' ? '▲' : '▼') : '▲';
      });
      renderTable();
    });
  });
}

/* ================= ВОРОНКА ================= */

function renderFunnel(){
  var wrap = $('#funnel');
  var first = FUNNEL[0].value;
  var html = '';
  FUNNEL.forEach(function(s, i){
    var pct = (s.value / first * 100);
    html += '<div class="f-stage">' +
      '<div class="f-head">' +
        '<span class="f-name">' + s.name + '</span>' +
        '<span class="f-val">' + fmtInt.format(s.value) +
          '<span class="f-pct">' + pct.toFixed(1).replace('.', ',') + '%</span></span>' +
      '</div>' +
      '<div class="f-track"><div class="f-fill" data-w="' + pct.toFixed(1) + '"></div></div>';
    if(i < FUNNEL.length - 1){
      var conv = (FUNNEL[i + 1].value / s.value * 100);
      html += '<div class="f-conv">↓ конверсия ' + conv.toFixed(1).replace('.', ',') + '%</div>';
    }
    html += '</div>';
  });
  wrap.innerHTML = html;
  /* анимация раскрытия баров после отрисовки */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      wrap.querySelectorAll('.f-fill').forEach(function(el){
        el.style.width = el.dataset.w + '%';
      });
    });
  });
}

/* ================= СИСТЕМА ================= */

function renderSystem(){
  var wrap = $('#sysList');
  var html = '';
  SYSTEM.forEach(function(s){
    html += '<div class="sys-row">' +
      '<span class="sys-dot ' + s.status + '"></span>' +
      '<span><span class="sys-name">' + s.name + '</span><br>' +
      '<span class="sys-status">' + s.statusText + '</span></span>' +
      '<span class="sys-right"><span class="sys-uptime">' + s.uptime + '</span><br>' +
      '<span class="sys-lat">' + s.lat + '</span></span>' +
    '</div>';
  });
  wrap.innerHTML = html;
}

/* ================= УПРАВЛЕНИЕ ================= */

function currentData(){
  return { values: state.series[state.metric], labels: state.dates };
}

function initSegments(){
  /* период */
  $('#periodSeg').addEventListener('click', function(e){
    var btn = e.target.closest('.seg-btn');
    if(!btn || btn.classList.contains('active')) return;
    this.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    state.period = parseInt(btn.dataset.period, 10);
    var wrap = $('#chartWrap');
    wrap.classList.add('fading');
    setTimeout(function(){
      buildSeries(state.period);
      var d = currentData();
      chart.values = []; /* сброс — полная перерисовка */
      chart.setData(d.values, d.labels, false);
      wrap.classList.remove('fading');
    }, 160);
  });
  /* метрика */
  $('#metricSeg').addEventListener('click', function(e){
    var btn = e.target.closest('.seg-btn');
    if(!btn || btn.classList.contains('active')) return;
    this.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    state.metric = btn.dataset.metric;
    var d = currentData();
    chart.setData(d.values, d.labels, true);
  });
}

function initSidebar(){
  var toggle = $('#sbToggle');
  toggle.addEventListener('click', function(){
    document.body.classList.toggle('sb-collapsed');
    var collapsed = document.body.classList.contains('sb-collapsed');
    toggle.setAttribute('aria-label', collapsed ? 'Развернуть меню' : 'Свернуть меню');
    toggle.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
    try{ localStorage.setItem('metric-sb', collapsed ? '1' : '0'); }catch(_){}
    /* после анимации сайдбара пересчитать ширину графика */
    setTimeout(function(){ chart.buildFrame(); chart.paint(); }, 260);
  });
  try{
    if(localStorage.getItem('metric-sb') === '1') document.body.classList.add('sb-collapsed');
  }catch(_){}

  /* навигация — переключение активного пункта (демо) */
  document.querySelectorAll('.nav-item').forEach(function(item){
    item.addEventListener('click', function(){
      document.querySelectorAll('.nav-item').forEach(function(i){ i.classList.remove('active'); });
      item.classList.add('active');
    });
  });
}

/* Live-обновления: каждые 5 с новая точка, плавный сдвиг */
var lastTick = Date.now();
function initLive(){
  setInterval(function(){
    if(document.hidden) return;
    if(chart.animating) return;
    tickSeries();
    lastTick = Date.now();
    var d = currentData();
    chart.setData(d.values, d.labels, true);
  }, 5000);
  /* «обновлено N сек назад» в футере */
  var el = $('#updatedAt');
  setInterval(function(){
    var s = Math.floor((Date.now() - lastTick) / 1000);
    el.textContent = s < 2 ? 'обновлено только что' : 'обновлено ' + s + ' сек назад';
  }, 1000);
}

/* Перестройка графика при ресайзе */
function initResize(){
  var t;
  window.addEventListener('resize', function(){
    clearTimeout(t);
    t = setTimeout(function(){ chart.buildFrame(); chart.paint(); }, 120);
  });
}

/* ================= СТАРТ ================= */

buildSeries(state.period);
renderKPIs();
renderTable();
initTableSort();
renderFunnel();
renderSystem();
initSegments();
initSidebar();
initResize();

var d0 = currentData();
chart.setData(d0.values, d0.labels, false);
runCounters();
initLive();

})();
</script>
</body>
</html>
